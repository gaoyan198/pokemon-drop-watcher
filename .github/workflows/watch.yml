name: pokemon-watch

on:
  # Scheduled runs are off: since 2026-10-02 Lazada blocks GitHub's servers (see POSTMORTEM.md).
  # The watcher now runs from the Mac via launchd/ (run-local.sh). Manual runs still work.
  workflow_dispatch:
    inputs:
      mode:
        description: "once | auto | drop | test | demo"
        default: once

concurrency:
  group: pokemon-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ inputs.mode || 'auto' }}" in
            test) python watch.py --test ;;
            demo) python watch.py --demo ;;
            drop) python watch.py --until 14:00 ;;
            once) python watch.py ;;
            *)    python watch.py --auto ;;
          esac

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
