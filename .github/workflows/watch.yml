name: pokemon-watch

on:
  schedule:
    # Weekday drop window is 13:00-14:00 SGT. GitHub often delays or silently skips
    # scheduled runs, so fire several; whichever starts first inside the window
    # (config.json drop_window) polls until 14:00, later ones queue and just sweep once.
    - cron: "17,32,47 4 * * 1-5"   # 12:17 / 12:32 / 12:47 SGT
    - cron: "2,17,32 5 * * 1-5"    # 13:02 / 13:17 / 13:32 SGT
    - cron: "23 */2 * * *"         # every 2h: sweep for off-schedule restocks + Jewel announcements
  workflow_dispatch:
    inputs:
      mode:
        description: "once | auto | drop | test | demo"
        default: once

concurrency:
  group: pokemon-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ inputs.mode || 'auto' }}" in
            test) python watch.py --test ;;
            demo) python watch.py --demo ;;
            drop) python watch.py --until 14:00 ;;
            once) python watch.py ;;
            *)    python watch.py --auto ;;
          esac

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
